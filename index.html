    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // Separate anonymous storage client. The existing documents bucket was
    // configured with anon file policies, while the main client becomes an
    // authenticated database client after sign-in.
    const sbFiles = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}
    });
    // Registered as early as possible (before app.js's own listener) so we
    // never miss the PASSWORD_RECOVERY event fired when a user lands here
    // via a "forgot password" email link — Supabase parses the recovery
    // token from the URL almost immediately after the client is created.
    window.__passwordRecoveryPending = false;
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') window.__passwordRecoveryPending = true;
    });
  </script>

<script>
  function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const isOpen  = sidebar.classList.toggle('sidebar-open');
    overlay.classList.toggle('active', isOpen);
  }
  // Κλείσιμο sidebar όταν ο χρήστης πατάει nav link (mobile)
  document.addEventListener('click', function(e) {
    const link = e.target.closest('.nav-link[data-nav]');
    if (link && window.innerWidth <= 768) {
      document.querySelector('.sidebar').classList.remove('sidebar-open');
      document.getElementById('sidebar-overlay').classList.remove('active');
    }
  });
</script>
