name: Dry Run Technical Safety Sync

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DRY-RUN-BOTH to validate elias and thomas without changing visits"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: technical-safety-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate September visits for both owners
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TECHNICAL_SAFETY_SYNC_KEY: ${{ secrets.TECHNICAL_SAFETY_SYNC_KEY }}
      TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64: ${{ secrets.TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64 }}

    steps:
      - name: Require explicit dry-run confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "DRY-RUN-BOTH" ]; then
            echo "::error::Dry-run stopped. Enter exactly DRY-RUN-BOTH."
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF TECHNICAL_SAFETY_SYNC_KEY TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare canonical payload
        id: payload
        shell: bash
        run: |
          base_file="$RUNNER_TEMP/technical-safety-base.json"
          printf '%s' "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64" | base64 --decode > "$base_file"

          jq -e '
            .dryRun == true
            and .sourceFile == "2026_09.pdf"
            and (.visits | type == "array")
            and (.visits | length == 35)
          ' "$base_file" >/dev/null

          jq '
            .sourceFile as $source
            | .visits |= map(
                .company |= gsub("\\s+"; " ")
                | .location |= (gsub("\\s+,"; ",") | gsub(",?\\s*null\\s*$"; ""))
                | .syncKey = ("TA-SYNC|" + $source + "|" + .visitAt + "|" + .company)
                | .notes = .syncKey
              )
          ' "$base_file" > "$RUNNER_TEMP/technical-safety-canonical.json"

          echo "payload_file=$RUNNER_TEMP/technical-safety-canonical.json" >> "$GITHUB_OUTPUT"

      - name: Dry-run both owners
        shell: bash
        run: |
          for owner in elias thomas
          do
            request_file="$RUNNER_TEMP/request-$owner.json"
            response_file="$RUNNER_TEMP/response-$owner.json"
            jq --arg owner "$owner" '.owner = $owner | .dryRun = true' \
              "${{ steps.payload.outputs.payload_file }}" > "$request_file"

            status="$(curl --silent --show-error --location \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/technical-safety-sync" \
              --header "Authorization: Bearer $TECHNICAL_SAFETY_SYNC_KEY" \
              --header "Content-Type: application/json" \
              --data-binary "@$request_file")"

            if [ "$status" != "200" ]; then
              safe_error="$(jq -c '{error, owner, message}' "$response_file" 2>/dev/null || printf '{"error":"invalid_response"}')"
              echo "::error::Dry-run for $owner returned HTTP $status: $safe_error"
              exit 1
            fi

            jq -e --arg owner "$owner" '
              .owner == $owner
              and .dryRun == true
              and .sourceFile == "2026_09.pdf"
              and .total == 35
            ' "$response_file" >/dev/null

            jq -r '"- " + .owner + ": create " + (.created|tostring) + ", update " + (.updated|tostring) + ", delete " + (.deleted|tostring) + ", unchanged " + (.unchanged|tostring)' \
              "$response_file" >> "$RUNNER_TEMP/summary-lines.txt"
          done

      - name: Write dry-run summary
        shell: bash
        run: |
          {
            echo "## Technical Safety two-owner dry-run"
            echo
            echo "- Source: 2026_09.pdf"
            cat "$RUNNER_TEMP/summary-lines.txt"
            echo "- No visit writes were performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/technical-safety-*.json "$RUNNER_TEMP"/request-*.json "$RUNNER_TEMP"/response-*.json "$RUNNER_TEMP/summary-lines.txt"
