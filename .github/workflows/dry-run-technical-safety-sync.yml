name: Dry Run Technical Safety Sync

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DRY-RUN to validate the encrypted payload without changing visits"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: technical-safety-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate September visits without writes
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TECHNICAL_SAFETY_SYNC_KEY: ${{ secrets.TECHNICAL_SAFETY_SYNC_KEY }}
      TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64: ${{ secrets.TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64 }}

    steps:
      - name: Require explicit dry-run confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "DRY-RUN" ]; then
            echo "::error::Dry-run stopped. Enter exactly DRY-RUN."
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF TECHNICAL_SAFETY_SYNC_KEY TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode and validate encrypted payload
        id: payload
        shell: bash
        run: |
          payload_file="$RUNNER_TEMP/technical-safety-payload.json"
          printf '%s' "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64" | base64 --decode > "$payload_file"

          jq -e '
            .dryRun == true
            and .sourceFile == "2026_09.pdf"
            and (.visits | type == "array")
            and (.visits | length == 35)
          ' "$payload_file" >/dev/null

          echo "payload_file=$payload_file" >> "$GITHUB_OUTPUT"

      - name: Invoke Edge Function in dry-run mode
        id: invoke
        shell: bash
        run: |
          response_file="$RUNNER_TEMP/technical-safety-response.json"
          status="$(
            curl --silent --show-error --location               --output "$response_file"               --write-out '%{http_code}'               --request POST               "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/technical-safety-sync"               --header "Authorization: Bearer $TECHNICAL_SAFETY_SYNC_KEY"               --header "Content-Type: application/json"               --data-binary "@${{ steps.payload.outputs.payload_file }}"
          )"

          if [ "$status" != "200" ]; then
            safe_error="$(jq -c '{error, message}' "$response_file" 2>/dev/null || printf '{"error":"invalid_response"}')"
            echo "::error::Edge Function returned HTTP $status: $safe_error"
            exit 1
          fi

          jq -e '
            .dryRun == true
            and .sourceFile == "2026_09.pdf"
            and .total == 35
          ' "$response_file" >/dev/null

          created="$(jq -r '.created' "$response_file")"
          updated="$(jq -r '.updated' "$response_file")"
          deleted="$(jq -r '.deleted' "$response_file")"
          unchanged="$(jq -r '.unchanged' "$response_file")"
          total="$(jq -r '.total' "$response_file")"

          {
            echo "## Technical Safety dry-run"
            echo
            echo "- Source: `2026_09.pdf`"
            echo "- Mode: dry-run (no visit writes)"
            echo "- Created: $created"
            echo "- Updated: $updated"
            echo "- Deleted: $deleted"
            echo "- Unchanged: $unchanged"
            echo "- Total: $total"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -f             "$RUNNER_TEMP/technical-safety-payload.json"             "$RUNNER_TEMP/technical-safety-response.json"
