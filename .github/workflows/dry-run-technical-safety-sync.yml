name: Dry Run Technical Safety Sync

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DRY-RUN-BOTH to validate elias and thomas without changing visits"
        required: true
        type: string
      source_file:
        description: "Exact source filename, for example 2026_09.pdf"
        required: true
        default: "2026_09.pdf"
        type: string
      expected_count:
        description: "Validated number of visits in the source PDF"
        required: true
        default: 106
        type: number

permissions:
  contents: read

concurrency:
  group: technical-safety-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate ${{ inputs.source_file }} for both owners
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TECHNICAL_SAFETY_SYNC_KEY: ${{ secrets.TECHNICAL_SAFETY_SYNC_KEY }}
      TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64: ${{ secrets.TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64 }}
      TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART1: ${{ secrets.TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART1 }}
      TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART2: ${{ secrets.TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART2 }}

    steps:
      - name: Require explicit dry-run confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "DRY-RUN-BOTH" ]; then
            echo "::error::Dry-run stopped. Enter exactly DRY-RUN-BOTH."
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF TECHNICAL_SAFETY_SYNC_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done

          if { [ -n "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART1" ] && [ -z "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART2" ]; } ||
             { [ -z "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART1" ] && [ -n "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART2" ]; }; then
            echo "::error::Both split payload secrets are required when either part is set."
            missing=1
          elif [ -z "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64" ] &&
               [ -z "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART1" ]; then
            echo "::error::Missing payload secret: set the single secret or both split parts."
            missing=1
          fi

          exit "$missing"

      - name: Prepare canonical payload
        id: payload
        shell: bash
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: |
          base_file="$RUNNER_TEMP/technical-safety-base.json"
          payload_b64="$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64"
          if [ -n "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART1" ] &&
             [ -n "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART2" ]; then
            payload_b64="${TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART1}${TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64_PART2}"
          fi
          printf '%s' "$payload_b64" | base64 --decode > "$base_file"

          source_file="$SOURCE_FILE"
          expected_count="$EXPECTED_COUNT"

          if ! [[ "$source_file" =~ ^[0-9]{4}_(0[1-9]|1[0-2])\.pdf$ ]]; then
            echo "::error::source_file must match YYYY_MM.pdf"
            exit 1
          fi
          if ! [[ "$expected_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::expected_count must be a positive integer"
            exit 1
          fi

          jq -e --arg source "$source_file" --argjson count "$expected_count" '
            .dryRun == true
            and .sourceFile == $source
            and (.visits | type == "array")
            and (.visits | length == $count)
          ' "$base_file" >/dev/null

          jq '
            .sourceFile as $source
            | .visits |= map(
                .company |= gsub("\\s+"; " ")
                | .location |= (gsub("\\s+,"; ",") | gsub(",?\\s*null\\s*$"; ""))
                | .syncKey = ("TA-SYNC|" + $source + "|" + .visitAt + "|" + .company)
                | .notes = .syncKey
              )
          ' "$base_file" > "$RUNNER_TEMP/technical-safety-canonical.json"

          echo "payload_file=$RUNNER_TEMP/technical-safety-canonical.json" >> "$GITHUB_OUTPUT"

      - name: Dry-run both owners
        shell: bash
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: |
          for owner in elias thomas
          do
            request_file="$RUNNER_TEMP/request-$owner.json"
            response_file="$RUNNER_TEMP/response-$owner.json"
            jq --arg owner "$owner" '.owner = $owner | .dryRun = true' \
              "${{ steps.payload.outputs.payload_file }}" > "$request_file"

            status="$(curl --silent --show-error --location \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/technical-safety-sync" \
              --header "Authorization: Bearer $TECHNICAL_SAFETY_SYNC_KEY" \
              --header "Content-Type: application/json" \
              --data-binary "@$request_file")"

            if [ "$status" != "200" ]; then
              safe_error="$(jq -c '{error, owner, message}' "$response_file" 2>/dev/null || printf '{"error":"invalid_response"}')"
              echo "::error::Dry-run for $owner returned HTTP $status: $safe_error"
              exit 1
            fi

            jq -e --arg owner "$owner" --arg source "$SOURCE_FILE" --argjson count "$EXPECTED_COUNT" '
              .owner == $owner
              and .dryRun == true
              and .sourceFile == $source
              and .total == $count
            ' "$response_file" >/dev/null

            jq -r '"- " + .owner + ": create " + (.created|tostring) + ", update " + (.updated|tostring) + ", delete " + (.deleted|tostring) + ", unchanged " + (.unchanged|tostring)' \
              "$response_file" >> "$RUNNER_TEMP/summary-lines.txt"
          done

      - name: Write dry-run summary
        shell: bash
        run: |
          {
            echo "## Technical Safety two-owner dry-run"
            echo
            echo "- Source: ${{ inputs.source_file }}"
            echo "- Expected visits: ${{ inputs.expected_count }}"
            cat "$RUNNER_TEMP/summary-lines.txt"
            echo "- No visit writes were performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/technical-safety-*.json "$RUNNER_TEMP"/request-*.json "$RUNNER_TEMP"/response-*.json "$RUNNER_TEMP/summary-lines.txt"
