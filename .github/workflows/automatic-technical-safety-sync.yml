name: Automatic Technical Safety Schedule Sync

on:
  schedule:
    - cron: "30 4 20 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-technical-safety-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Validate and sync general schedule
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TECHNICAL_SAFETY_SYNC_KEY: ${{ secrets.TECHNICAL_SAFETY_SYNC_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_NAMESPACE_ID: ${{ secrets.DROPBOX_NAMESPACE_ID }}
      DROPBOX_SOURCE_PATH: /03. ΤΕΧΝΙΚΟΣ ΑΣΦΑΛΕΙΑΣ/technical_safety_schedule.pdf

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF TECHNICAL_SAFETY_SYNC_KEY DROPBOX_APP_KEY DROPBOX_APP_SECRET DROPBOX_REFRESH_TOKEN DROPBOX_NAMESPACE_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub production secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check --quiet pdfplumber==0.11.7

      - name: Download exact general PDF from Dropbox
        shell: bash
        run: |
          token_file="$RUNNER_TEMP/dropbox-token.json"
          status="$(curl --silent --show-error --location \
            --output "$token_file" --write-out '%{http_code}' \
            --user "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" \
            --data-urlencode grant_type=refresh_token \
            --data-urlencode refresh_token="$DROPBOX_REFRESH_TOKEN" \
            https://api.dropboxapi.com/oauth2/token)"
          if [ "$status" != "200" ]; then
            echo "::error::Dropbox token exchange failed with HTTP $status"
            exit 1
          fi
          access_token="$(jq -er '.access_token' "$token_file")"
          api_arg="$(jq -cn --arg path "$DROPBOX_SOURCE_PATH" '{path:$path}')"
          path_root="$(jq -cn --arg namespace_id "$DROPBOX_NAMESPACE_ID" '{".tag":"namespace_id",namespace_id:$namespace_id}')"
          pdf="$RUNNER_TEMP/technical_safety_schedule.pdf"
          status="$(curl --silent --show-error --location \
            --output "$pdf" --write-out '%{http_code}' \
            --request POST https://content.dropboxapi.com/2/files/download \
            --header "Authorization: Bearer $access_token" \
            --header "Dropbox-API-Path-Root: $path_root" \
            --header "Dropbox-API-Arg: $api_arg")"
          unset access_token
          rm -f "$token_file"
          if [ "$status" != "200" ] || [ ! -s "$pdf" ]; then
            echo "::error::Dropbox download failed with HTTP $status"
            exit 1
          fi
          file "$pdf" | grep -q 'PDF document' || { echo "::error::Downloaded source is not a PDF"; exit 1; }

      - name: Parse and validate current/future months
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ta-payloads"
          python scripts/technical_safety_schedule.py \
            --pdf "$RUNNER_TEMP/technical_safety_schedule.pdf" \
            --output-dir "$RUNNER_TEMP/ta-payloads"

      - name: Dry-run every month for both owners
        id: preview
        shell: bash
        run: |
          : > "$RUNNER_TEMP/preview.tsv"
          deletion_total=0
          while IFS=$'\t' read -r source payload count
          do
            for owner in elias thomas
            do
              request="$RUNNER_TEMP/request-$owner-${source%.pdf}.json"
              response="$RUNNER_TEMP/preview-$owner-${source%.pdf}.json"
              jq --arg owner "$owner" '.owner=$owner | .dryRun=true' "$RUNNER_TEMP/ta-payloads/$payload" > "$request"
              status="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
                --request POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/technical-safety-sync" \
                --header "Authorization: Bearer $TECHNICAL_SAFETY_SYNC_KEY" \
                --header 'Content-Type: application/json' --data-binary "@$request")"
              if [ "$status" != "200" ]; then
                safe_error="$(jq -c '{error,owner,message}' "$response" 2>/dev/null || printf '{"error":"invalid_response"}')"
                echo "::error::Dry-run $owner $source returned HTTP $status: $safe_error"
                exit 1
              fi
              jq -e --arg owner "$owner" --arg source "$source" --argjson count "$count" \
                '.owner==$owner and .sourceFile==$source and .dryRun==true and .total==$count' "$response" >/dev/null
              created="$(jq -r '.created' "$response")"; updated="$(jq -r '.updated' "$response")"
              deleted="$(jq -r '.deleted' "$response")"; unchanged="$(jq -r '.unchanged' "$response")"
              deletion_total=$((deletion_total + deleted))
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$source" "$owner" "$created" "$updated" "$deleted" "$unchanged" >> "$RUNNER_TEMP/preview.tsv"
            done
          done < <(jq -r '.months[] | [.sourceFile,.payload,.count] | @tsv' "$RUNNER_TEMP/ta-payloads/manifest.json")
          echo "deletion_total=$deletion_total" >> "$GITHUB_OUTPUT"

      - name: Write preview summary
        shell: bash
        run: |
          {
            echo "## Technical Safety automatic preview"
            echo
            jq -r '"- Physical source: `"+.physicalSource+"`\n- Checksum: `"+.sourceChecksum+"`\n- Current/future visits: "+(.total|tostring)+"\n- Past visits ignored: "+(.ignoredPast|tostring)' "$RUNNER_TEMP/ta-payloads/manifest.json"
            echo
            echo "| Month | Owner | Create | Update | Delete | Unchanged |"
            echo "|---|---:|---:|---:|---:|---:|"
            awk -F '\t' '{printf "| %s | %s | %s | %s | %s | %s |\n",$1,$2,$3,$4,$5,$6}' "$RUNNER_TEMP/preview.tsv"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop safely when deletions need approval
        if: steps.preview.outputs.deletion_total != '0'
        shell: bash
        run: |
          echo "::error::Live sync blocked: the preview proposes ${{ steps.preview.outputs.deletion_total }} deletions. Review the exact owner/month counts in the summary and run the protected manual workflow only after explicit approval."
          exit 1

      - name: Live sync every month for both owners
        shell: bash
        run: |
          while IFS=$'\t' read -r source payload count
          do
            for owner in elias thomas
            do
              request="$RUNNER_TEMP/live-request-$owner-${source%.pdf}.json"
              response="$RUNNER_TEMP/live-response-$owner-${source%.pdf}.json"
              jq --arg owner "$owner" '.owner=$owner | .dryRun=false' "$RUNNER_TEMP/ta-payloads/$payload" > "$request"
              status="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
                --request POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/technical-safety-sync" \
                --header "Authorization: Bearer $TECHNICAL_SAFETY_SYNC_KEY" \
                --header 'Content-Type: application/json' --data-binary "@$request")"
              [ "$status" = "200" ] || { echo "::error::Live sync $owner $source returned HTTP $status"; exit 1; }
              jq -e --arg owner "$owner" --arg source "$source" --argjson count "$count" \
                '.owner==$owner and .sourceFile==$source and .dryRun==false and .total==$count and .deleted==0' "$response" >/dev/null
              jq -r '"- Live "+.sourceFile+" / "+.owner+": create "+(.created|tostring)+", update "+(.updated|tostring)+", unchanged "+(.unchanged|tostring)' "$response" >> "$RUNNER_TEMP/live-summary.txt"
            done
          done < <(jq -r '.months[] | [.sourceFile,.payload,.count] | @tsv' "$RUNNER_TEMP/ta-payloads/manifest.json")

      - name: Post-live idempotency check
        shell: bash
        run: |
          while IFS=$'\t' read -r source payload count
          do
            for owner in elias thomas
            do
              request="$RUNNER_TEMP/post-request-$owner-${source%.pdf}.json"
              response="$RUNNER_TEMP/post-response-$owner-${source%.pdf}.json"
              jq --arg owner "$owner" '.owner=$owner | .dryRun=true' "$RUNNER_TEMP/ta-payloads/$payload" > "$request"
              status="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
                --request POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/technical-safety-sync" \
                --header "Authorization: Bearer $TECHNICAL_SAFETY_SYNC_KEY" \
                --header 'Content-Type: application/json' --data-binary "@$request")"
              [ "$status" = "200" ] || { echo "::error::Post-check $owner $source returned HTTP $status"; exit 1; }
              jq -e --arg owner "$owner" --arg source "$source" --argjson count "$count" \
                '.owner==$owner and .sourceFile==$source and .dryRun==true and .total==$count and .created==0 and .updated==0 and .deleted==0 and .unchanged==$count' "$response" >/dev/null \
                || { echo "::error::Post-check was not fully unchanged for $owner $source"; exit 1; }
            done
          done < <(jq -r '.months[] | [.sourceFile,.payload,.count] | @tsv' "$RUNNER_TEMP/ta-payloads/manifest.json")
          {
            echo
            echo "## Live result"
            cat "$RUNNER_TEMP/live-summary.txt"
            echo "- Post-live dry-run: fully unchanged for every owner/month"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ta-payloads" "$RUNNER_TEMP"/technical_safety_schedule.pdf "$RUNNER_TEMP"/*request-*.json "$RUNNER_TEMP"/*response-*.json "$RUNNER_TEMP"/preview.tsv "$RUNNER_TEMP"/live-summary.txt "$RUNNER_TEMP"/dropbox-token.json
