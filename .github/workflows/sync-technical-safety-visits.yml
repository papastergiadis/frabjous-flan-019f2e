name: Sync Technical Safety Visits

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type SYNC-35 to create the 35 validated visits in production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: technical-safety-production-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync 35 September visits to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TECHNICAL_SAFETY_SYNC_KEY: ${{ secrets.TECHNICAL_SAFETY_SYNC_KEY }}
      TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64: ${{ secrets.TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64 }}

    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "SYNC-35" ]; then
            echo "::error::Production sync stopped. Enter exactly SYNC-35."
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF TECHNICAL_SAFETY_SYNC_KEY TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare and validate payloads
        id: payload
        shell: bash
        run: |
          dry_file="$RUNNER_TEMP/technical-safety-dry-run.json"
          live_file="$RUNNER_TEMP/technical-safety-live.json"

          printf '%s' "$TECHNICAL_SAFETY_DRY_RUN_PAYLOAD_B64" | base64 --decode > "$dry_file"

          jq -e '
            .dryRun == true
            and .sourceFile == "2026_09.pdf"
            and (.visits | type == "array")
            and (.visits | length == 35)
            and ([.visits[].syncKey] | unique | length == 35)
          ' "$dry_file" >/dev/null

          jq '.dryRun = false' "$dry_file" > "$live_file"

          echo "dry_file=$dry_file" >> "$GITHUB_OUTPUT"
          echo "live_file=$live_file" >> "$GITHUB_OUTPUT"

      - name: Reconfirm safe preflight
        shell: bash
        run: |
          response_file="$RUNNER_TEMP/technical-safety-preflight-response.json"
          status="$(
            curl --silent --show-error --location               --output "$response_file"               --write-out '%{http_code}'               --request POST               "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/technical-safety-sync"               --header "Authorization: Bearer $TECHNICAL_SAFETY_SYNC_KEY"               --header "Content-Type: application/json"               --data-binary "@${{ steps.payload.outputs.dry_file }}"
          )"

          if [ "$status" != "200" ]; then
            safe_error="$(jq -c '{error, message}' "$response_file" 2>/dev/null || printf '{"error":"invalid_response"}')"
            echo "::error::Preflight returned HTTP $status: $safe_error"
            exit 1
          fi

          jq -e '
            .dryRun == true
            and .sourceFile == "2026_09.pdf"
            and .created == 35
            and .updated == 0
            and .deleted == 0
            and .unchanged == 0
            and .total == 35
          ' "$response_file" >/dev/null || {
            echo "::error::Production state changed since approval. No live sync was performed."
            jq -c '{created, updated, deleted, unchanged, total}' "$response_file"
            exit 1
          }

      - name: Apply production sync
        shell: bash
        run: |
          response_file="$RUNNER_TEMP/technical-safety-live-response.json"
          status="$(
            curl --silent --show-error --location               --output "$response_file"               --write-out '%{http_code}'               --request POST               "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/technical-safety-sync"               --header "Authorization: Bearer $TECHNICAL_SAFETY_SYNC_KEY"               --header "Content-Type: application/json"               --data-binary "@${{ steps.payload.outputs.live_file }}"
          )"

          if [ "$status" != "200" ]; then
            safe_error="$(jq -c '{error, message}' "$response_file" 2>/dev/null || printf '{"error":"invalid_response"}')"
            echo "::error::Production sync returned HTTP $status: $safe_error"
            exit 1
          fi

          jq -e '
            .dryRun == false
            and .sourceFile == "2026_09.pdf"
            and .total == 35
          ' "$response_file" >/dev/null

          created="$(jq -r '.created' "$response_file")"
          updated="$(jq -r '.updated' "$response_file")"
          deleted="$(jq -r '.deleted' "$response_file")"
          unchanged="$(jq -r '.unchanged' "$response_file")"
          total="$(jq -r '.total' "$response_file")"

          {
            echo "## Technical Safety production sync"
            echo
            echo "- Source: `2026_09.pdf`"
            echo "- Created: $created"
            echo "- Updated: $updated"
            echo "- Deleted: $deleted"
            echo "- Unchanged: $unchanged"
            echo "- Total: $total"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -f             "$RUNNER_TEMP/technical-safety-dry-run.json"             "$RUNNER_TEMP/technical-safety-live.json"             "$RUNNER_TEMP/technical-safety-preflight-response.json"             "$RUNNER_TEMP/technical-safety-live-response.json"
